<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadAI</title>
    <link rel="stylesheet" href="{{url_for('static',filesame'chatstyle.css')}}">
    </head>
    <body>
        <div class="chat-container">
            <h1>BadAI</h1>
            <div class="chat-box">
                {% for message in messages %}
                    <div class="message {{ 'user' if message['role'] == 'user' else 'bot' }}">
                        <p>{{ message['content'] }}</p>
                    </div>
                {% endfor %}
                <div class="message user">
                    <form action="{{ url_for('chat') }}" method="post">
                        <input type="text" name="user_input" placeholder="Type your message here..." required>
                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='chat.js') }}"></script>
    </body>
</html>
